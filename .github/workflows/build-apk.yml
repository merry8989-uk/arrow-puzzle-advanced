name: Build signed APK

# Builds the APK with tools/build-apk.sh and signs it with the release keystore,
# which is supplied from repository secrets (never committed). Add these under
# Settings -> Secrets and variables -> Actions:
#
#   KEYSTORE_BASE64     base64 of apa-release.jks   (base64 -w0 apa-release.jks)
#   KEYSTORE_PASSWORD   keystore (store) password
#   KEY_ALIAS           key alias, e.g. apa
#   KEY_PASSWORD        key password
#
# Run it from the Actions tab ("Run workflow"), or push a tag like v5.5.
# On a tag push the APK is attached to the matching GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build and sign APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          APA_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          APA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash tools/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrow-puzzle-apk
          path: build-manual/*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-manual/*.apk
